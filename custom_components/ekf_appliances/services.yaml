probe_remote_receive:
  name: Проверить приём универсального пульта
  description: До 30 секунд ожидает кнопку физического пульта через EKF. Не отправляет команды бытовой технике. После проверки выходит из обучения.
  fields:
    remote_entity_id:
      required: true
      selector:
        entity:
          domain: remote
          integration: tuya_local
    seconds:
      default: 30
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: s

wake_if_current:
  target:
    entity:
      integration: ekf_appliances
      domain: media_player
  fields:
    expected_revision:
      required: true
      selector:
        text:

projector_start_for_playback:
  name: Start projector for playback
  description: Select the projector and wait for both the display and Kodi to confirm startup.

remote_prepare:
  name: Prepare universal remote mode
  description: Resolve one accepted physical key through the canonical mode controller.
  fields:
    button:
      required: true
      selector: {text: {}}
    received_ms:
      description: Trusted receiver event time in UTC milliseconds; retrieves the captured route without replaying the press. Omit for a current-time compatibility call.
      selector: {number: {min: 0, max: 9999999999999, mode: box}}
    expected_ms:
      selector: {number: {min: 0, max: 9999999999999, mode: box}}
    wake_id:
      selector: {text: {}}

remote_select:
  name: Select universal remote pair
  description: Commit one explicit pair/native choice with a sixty-second inactivity lease.
  fields:
    pair:
      required: true
      selector: {select: {options: [tv, projector]}}
    native:
      default: false
      selector: {boolean: {}}
    explicit:
      default: true
      selector: {boolean: {}}

remote_resolve:
  name: Resolve universal remote target
  description: Recheck a queued command's pair and native target against current safety state.
  fields:
    pair:
      selector: {select: {options: [tv, projector]}}
    native:
      selector: {boolean: {}}

remote_power:
  name: Universal remote power
  description: Reject repeated Power while either pair is starting or stopping; retain accepted lifecycle confirmation.
  fields:
    pair:
      selector: {select: {options: [tv, projector]}}
    native:
      selector: {boolean: {}}

    power_request_id:
      description: Admission token returned for a physical Power press by remote_prepare.
      selector: {text: {}}

remote_reject:
  name: Signal a rejected remote command
  description: Play the quiet error cue for one recognized logical press.
  fields:
    reason:
      required: true
      selector: {text: {}}
    press_id:
      description: Stable physical press identity. When omitted, uses the physical press that remote_prepare bound to the caller context, else the caller context ID.
      selector: {text: {}}

remote_captured_action:
  name: Forward captured household key
  description: Recheck the physical key and target before sending its light, climate or single-Audio action.
  fields:
    button:
      required: true
      selector: {select: {options: [smart, red, green, yellow, channel_up, channel_down, prime, audio]}}
    received_ms:
      required: true
      selector: {number: {min: 1, max: 9999999999999, mode: box}}
    temperature:
      description: Setpoint in Home Assistant display units.
      selector: {number: {mode: box}}
    hvac_mode:
      selector: {select: {options: ["off", heat, cool]}}
    entity_id:
      description: Player selected by the music remote for a single Audio press.
      selector: {entity: {domain: media_player}}
    playback:
      selector: {select: {options: [play, pause, wave]}}

remote_dispatch:
  name: Dispatch guarded remote command
  description: Final command boundary for the universal remote package; preserves native service responses.
  fields:
    domain:
      required: true
      selector: {select: {options: [kodi, media_player, button, rest_command, remote, androidtv_remote]}}
    service:
      required: true
      selector: {text: {}}
    service_data:
      selector: {object: {}}
    pair:
      selector: {select: {options: [tv, projector]}}
    return_response:
      default: false
      selector: {boolean: {}}

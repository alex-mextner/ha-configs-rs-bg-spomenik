refresh:
  name: Обновить состояние растений
  description: Пересчитать предупреждения и автоматическое наблюдение по текущим данным без полива и запроса новой физической выборки.
apply_calibration:
  name: Применить подготовленную калибровку
  description: Внутреннее действие для сохранённой проверенной транзакции; отклоняет изменившиеся настройки и чужой контекст. Только администратор.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: input_number
    transaction_id:
      required: true
      selector:
        text:
record_reference:
  name: Прочитать независимый эталон
  description: Прочитать только заранее настроенный независимый источник и протокол для растения; значения эталона из вызова не принимаются. Только администратор.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
acknowledge:
  name: Подтвердить доставку предупреждения
  description: Внутреннее действие blueprint после отправки уведомления; обеспечивает повтор при пропуске события на старте HA.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
    status:
      required: true
      selector:
        select:
          options: [due, overdue, sensor_error]
snooze:
  name: Отложить напоминание о поливе на 24 часа
  description: Приостанавливает только напоминание companion; не изменяет даты полива или удобрения.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
set_photo:
  name: Загрузить фото растения
  description: Сохранить загруженный PNG или JPEG для растения Adaptive Plant (только администратор).
  fields:
    entry_id:
      required: true
      selector:
        text:
    file_id:
      required: true
      selector:
        text:
announce:
  name: Озвучить напоминание на выбранной колонке
  description: Отправить текст один раз на колонку из настроек напоминаний о поливе.
  fields:
    message:
      required: true
      selector:
        text:

refresh:
  name: Обновить состояние растений
  description: Пересчитать предупреждения по текущим данным без полива и изменения калибровки.
acknowledge:
  name: Подтвердить доставку предупреждения
  description: Внутреннее действие blueprint после отправки уведомления; обеспечивает повтор при пропуске события на старте HA.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
    status:
      required: true
      selector:
        select:
          options: [due, overdue, sensor_error]
snooze:
  name: Отложить напоминание о поливе на 24 часа
  description: Приостанавливает только напоминание companion; не изменяет даты полива или удобрения.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
set_photo:
  name: Загрузить фото растения
  description: Сохранить загруженный PNG или JPEG для растения Adaptive Plant (только администратор).
  fields:
    entry_id:
      required: true
      selector:
        text:
    file_id:
      required: true
      selector:
        text:

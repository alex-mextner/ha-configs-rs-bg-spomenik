# Native parser and calibration entities. No calibration values are forced.
uart:
  id: radar_uart
  tx_pin: ${radar_tx_pin}
  rx_pin: ${radar_rx_pin}
  baud_rate: ${radar_baud_rate}
  parity: NONE
  stop_bits: 1

ld2410:
  id: presence_radar
  uart_id: radar_uart

binary_sensor:
  - platform: ld2410
    has_target:
      id: radar_occupancy
      name: Occupancy
      device_class: occupancy
      # MUST stay first and alone: it receives EVERY parsed periodic report,
      # including unchanged values. Its timeout invalidates the entity instead
      # of publishing false. Other filters can deduplicate or schedule a stale
      # false state. Apply occupancy hold policy in the light controller.
      filters:
        - timeout: ${radar_report_timeout}
    has_moving_target:
      id: radar_moving_target
      name: Moving Target
      filters:
        - timeout: ${radar_report_timeout}
    has_still_target:
      id: radar_still_target
      name: Still Target
      filters:
        - timeout: ${radar_report_timeout}
  - platform: template
    id: radar_reports_healthy
    name: Radar Reports Healthy
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(radar_occupancy).has_state();

sensor:
  - platform: ld2410
    moving_distance:
      name: Moving Distance
      id: radar_moving_distance
    still_distance:
      name: Still Distance

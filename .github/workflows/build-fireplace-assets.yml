name: Build fireplace asset candidates

on:
  push:
    paths:
      - scripts/ci/prepare_fireplace_assets.py
      - scripts/ci/fireplace-sources.json
      - .github/workflows/build-fireplace-assets.yml
  workflow_dispatch:
    inputs:
      source_only:
        description: Download and verify originals without encoding candidates
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fireplace-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_ONLY: ${{ inputs.source_only || false }}
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the runner's FFmpeg package
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          task_log="/tmp/fireplace-assets-setup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          exec > >(tee -a "$task_log") 2>&1
          task_started=$SECONDS
          finish_setup() {
            setup_rc=$?
            printf '%s completed rc=%s elapsed=%ss log=%s\n' \
              "$(date -Is)" "$setup_rc" "$((SECONDS-task_started))" "$task_log"
            exit "$setup_rc"
          }
          trap finish_setup EXIT
          printf '%s starting log=%s\n' "$(date -Is)" "$task_log"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg curl util-linux
          ffmpeg -version
      - name: Verify cancellation boundaries without media
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import signal
          import sys
          import tempfile
          import time
          from unittest import mock

          spec = importlib.util.spec_from_file_location(
              "fireplace_assets", "scripts/ci/prepare_fireplace_assets.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          log_dir, main_log = module.start_logging()
          started, outcome = time.monotonic(), 1
          children = []
          previous = {sig: signal.getsignal(sig) for sig in (signal.SIGINT, signal.SIGTERM)}

          def reset_cancellation():
              module.CANCELLATION = module.Cancellation()
              for sig in previous:
                  signal.signal(sig, module.CANCELLATION.request)

          try:
              with tempfile.TemporaryDirectory(prefix="fireplace-cancellation-", dir="/tmp") as temporary:
                  reset_cancellation()
                  builder = module.Builder(Path(temporary) / "spawn", log_dir)
                  real_popen = module.subprocess.Popen

                  def interrupt_spawn(*args, **kwargs):
                      child = real_popen(*args, **kwargs)
                      children.append(child)
                      os.kill(os.getpid(), signal.SIGTERM)
                      return child

                  with mock.patch.object(module.subprocess, "Popen", side_effect=interrupt_spawn):
                      try:
                          builder.command("cancel-at-spawn", [sys.executable, "-c", "import time; time.sleep(30)"])
                      except module.BuildError as error:
                          assert error.exit_code == 143, error.exit_code
                      else:
                          raise AssertionError("Cancellation during spawn was not reported")
                  assert children[0].poll() is not None, "Owned child survived cancellation"
                  assert module.finalize_build(builder, module.initial_receipt(), 143, started) == 143
                  module.LOG.info("stage=cancel-at-spawn passed child_reaped=true rc=143")

                  for prior_status, expected_status in ((0, 130), (17, 17)):
                      reset_cancellation()
                      builder = module.Builder(Path(temporary) / f"finalize-{prior_status}", log_dir)
                      receipt = module.initial_receipt()
                      real_write = module.write_json

                      def interrupt_write(path, value):
                          os.kill(os.getpid(), signal.SIGINT)
                          real_write(path, value)

                      with mock.patch.object(module, "write_json", side_effect=interrupt_write):
                          actual = module.finalize_build(builder, receipt, prior_status, started)
                      saved = json.loads((builder.output / "receipt.json").read_text())
                      assert actual == expected_status, (actual, expected_status)
                      assert saved["exit_code"] == expected_status, saved
                      assert saved["status"] == "failed", saved
                      assert saved["cancellation_signal"] == signal.SIGINT, saved
                      module.LOG.info("stage=cancel-during-receipt passed prior_rc=%s rc=%s", prior_status, actual)
                  outcome = 0
          except Exception:
              module.LOG.exception("CI cancellation boundary check failed")
          finally:
              for child in children:
                  module.stop_child(child)
              for sig, handler in previous.items():
                  signal.signal(sig, handler)
              module.LOG.info("completed rc=%s elapsed=%.1fs log=%s", outcome, time.monotonic() - started, main_log)
          sys.exit(outcome)
          PY
      - name: Prepare and measure the actual candidate files
        id: build
        env:
          ASSET_OUTPUT: ${{ runner.temp }}/fireplace-assets-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail
          arguments=(--output-dir "$ASSET_OUTPUT")
          if [[ "$SOURCE_ONLY" == true ]]; then
            arguments+=(--source-only)
          fi
          exec python3 scripts/ci/prepare_fireplace_assets.py "${arguments[@]}"
      - name: Upload validated candidates and exact-byte receipts
        if: success() && inputs.source_only != true
        id: candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fireplace-candidates-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fireplace-assets-${{ github.run_id }}-${{ github.run_attempt }}/assets/
            ${{ runner.temp }}/fireplace-assets-${{ github.run_id }}-${{ github.run_attempt }}/review/
            ${{ runner.temp }}/fireplace-assets-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            ${{ runner.temp }}/fireplace-assets-${{ github.run_id }}-${{ github.run_attempt }}/sources.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Record uploaded artifact identity
        if: success() && steps.candidates.outputs.artifact-id != ''
        env:
          ARTIFACT_URL: ${{ steps.candidates.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.candidates.outputs.artifact-digest }}
          ASSET_RECEIPT: ${{ runner.temp }}/fireplace-assets-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
        run: |
          set -Eeuo pipefail
          umask 077
          task_log="/tmp/fireplace-assets-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          exec > >(tee -a "$task_log") 2>&1
          task_started=$SECONDS
          finish_identity() {
            identity_rc=$?
            printf '%s completed rc=%s elapsed=%ss log=%s\n' \
              "$(date -Is)" "$identity_rc" "$((SECONDS-task_started))" "$task_log"
            exit "$identity_rc"
          }
          trap finish_identity EXIT
          printf '%s starting log=%s\n' "$(date -Is)" "$task_log"
          read -r receipt_sha256 _ < <(sha256sum "$ASSET_RECEIPT")
          printf 'Candidate artifact: %s\n\nArtifact SHA-256: %s\n\nReceipt SHA-256: %s\n\nCandidates remain disabled pending source and sound review.\n' \
            "$ARTIFACT_URL" "$ARTIFACT_SHA256" "$receipt_sha256" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve source verification and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fireplace-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fireplace-assets-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
            ${{ runner.temp }}/fireplace-assets-${{ github.run_id }}-${{ github.run_attempt }}/sources.json
            /tmp/prepare-fireplace-assets-*/
            /tmp/fireplace-assets-setup-*.log
            /tmp/fireplace-assets-identity-*.log
          if-no-files-found: error
          retention-days: 14

name: "Lint"

on:
  push:
  pull_request:
    branches:
      - "main"

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-24.04"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v6.0.2"

        # The tracked u1_* aliases point directly into this pinned submodule.
        # Do not fetch unrelated or recursive submodules, or follow a branch tip.
        - name: "Checkout the pinned 3d-cli alias sources"
          run: git submodule update --init --depth 1 -- 3d-cli

        - name: "Set up Python"
          uses: actions/setup-python@v6.2.0
          with:
            python-version: "3.13"
            cache: "pip"
            cache-dependency-path: "requirements/dev.txt"

        - name: "Install requirements"
          run: python3 -m pip install -r requirements/dev.txt

        - name: "Lint"
          run: python3 -m ruff check .

        - name: "Format"
          run: python3 -m ruff format . --check

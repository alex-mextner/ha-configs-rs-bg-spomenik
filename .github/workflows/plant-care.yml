name: Plant care

on:
  push:
    branches:
      - main
      - feat/plant-care-yandex-main-20261118
      - feat/plant-care-alerts
      - feat/plant-autocalibration-20261118
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plant-care:
    name: Plant care and Alice status
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"
      - name: Exercise plant inference and native HA report actions
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          task_log="/tmp/ha-plant-care-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.log"
          exec > >(tee -a "$task_log") 2>&1
          task_started=$SECONDS
          trap 'rc=$?; printf "%s finished rc=%s elapsed=%ss log=%s\n" "$(date -Is)" "$rc" "$((SECONDS-task_started))" "$task_log"; exit "$rc"' EXIT
          printf '%s starting commit=%s log=%s\n' "$(date -Is)" "$(git rev-parse HEAD)" "$task_log"
          python3 -m pip install -r requirements/remote-routing-ci.txt
          mkdir -p .cache/test-results
          PYTHONPATH="$PWD" python3 -m pytest -q --import-mode=importlib \
            --junitxml=.cache/test-results/plant-care.xml tests/plant_care_alerts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plant-care-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/ha-plant-care-*.log
            .cache/test-results/plant-care.xml
          retention-days: 14

  reliability:
    name: Plant tests and installed-HA compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'
      - name: Install lint dependencies
        run: python -m pip install ruff==0.15.13
      - name: Lint scoped implementation
        run: |
          ruff check custom_components/plant_care_alerts tests/plant_care scripts/host/ha_plant_sensor_recovery.py tests/plant_recovery
          ruff format --check custom_components/plant_care_alerts tests/plant_care scripts/host/ha_plant_sensor_recovery.py tests/plant_recovery
          node --check www/plant-care/plant-care-card.js
      - name: Card behavior
        if: always()
        run: |
          node tests/plant_care/test_card.cjs
          node tests/plant_care/test_reliability_card.cjs
          node tests/plant_care/test_autocalibration_card.cjs
      - name: Recovery controller regression tests
        if: always()
        run: python3 tests/plant_recovery/test_recovery.py
      - name: All tests in the deployed Home Assistant version
        if: always()
        # Matches the verified production version, not the moving stable tag.
        run: >-
          docker run --rm --entrypoint python3
          -v "$PWD:/workspace:ro" -w /workspace
          -e PYTHONPATH=/workspace -e PYTHONDONTWRITEBYTECODE=1
          -e PLANT_NATIVE_HA_REQUIRED=1
          ghcr.io/home-assistant/home-assistant:2026.9.3
          -m unittest discover -s tests/plant_care -v


  component-preview:
    name: Plant card component preview from observed API state
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser in the native CI runner
        run: |
          npm install --prefix "$RUNNER_TEMP/plant-card-browser" --no-save --package-lock=false --ignore-scripts playwright@1.65.1
          "$RUNNER_TEMP/plant-card-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render the captured baseline with its original card revision
        env:
          NODE_PATH: ${{ runner.temp }}/plant-card-browser/node_modules
        run: >-
          node tests/plant_care/render_component.cjs
          --snapshot tests/plant_care/fixtures/autocalibration-before.json
          --card-revision 14cafefee7ac09578b0174229b67af26189e018c
          --expected-card-sha 4a9059f2b8e2a3cd139e88e81af12237442fef1aecdc0e9cbf7cb3d16c92fcd3
          --output "$RUNNER_TEMP/plant-card-preview/before"
      - name: Render the component from the captured plant state
        env:
          NODE_PATH: ${{ runner.temp }}/plant-card-browser/node_modules
        run: >-
          node tests/plant_care/render_component.cjs
          --snapshot tests/plant_care/fixtures/live-reading.json
          --output "$RUNNER_TEMP/plant-card-preview"
      - name: Save component screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: plant-card-component-preview
          path: ${{ runner.temp }}/plant-card-preview/
          if-no-files-found: error
          retention-days: 14

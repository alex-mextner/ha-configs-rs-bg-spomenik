# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN001", # Allow untyped pytest fixture args
    "ARG002", # Allow unused args in test doubles
    "D102",   # Test helper methods do not require docstrings
    "D103",   # Test functions do not require docstrings
    "D107",   # Test helper initializers do not require docstrings
    "E501",   # Allow long assertion/import lines in tests
    "PLR2004", # Magic values in assertions are acceptable in tests
    "SLF001", # Tests can access private members for white-box behavior checks
]

# These copied upstream tests are a frozen historical regression snapshot.
# Its base/candidate gate requires exact source bytes, including import order.
"tests/custom_components/home_generative_agent/**/*.py" = ["I001"]

# Both Kodi workflow jobs use stdlib unittest discovery. These two rules
# prescribe pytest assertions/pytest.raises and do not apply to these suites.
"tests/kodi_fireplace/test_*.py" = ["PT009", "PT027"]
"tests/kodi_fireplace_ha/test_living_room_fireplace.py" = ["PT009", "PT027"]

# These command-line tools intentionally report status or machine-readable JSON.
# Ruff's print rule is intended for accidental debugging output in library code.
"scripts/agent_browser_memory_guard.py" = ["T201"]
"scripts/ha_health_monitor.py" = ["T201"]
"scripts/ha_validate_lovelace.py" = ["T201"]
"scripts/ma_accounts.py" = ["T201"]
"scripts/transmission_errors.py" = ["T201"]

# This out-of-tree test module is collected by pytest, which rewrites assertions.
# It is loaded by path from a standalone container directory, not a Python package.
"docker/chatgpt-web/test_bridge.py" = ["S101", "INP001"]

# This standalone entry point is launched by its path in a hyphenated directory.
"scripts/chatgpt-native/bridge.py" = ["INP001"]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

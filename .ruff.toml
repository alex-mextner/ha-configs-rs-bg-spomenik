# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN001", # Allow untyped pytest fixture args
    "ARG002", # Allow unused args in test doubles
    "D102",   # Test helper methods do not require docstrings
    "D103",   # Test functions do not require docstrings
    "D107",   # Test helper initializers do not require docstrings
    "E501",   # Allow long assertion/import lines in tests
    "PLR2004", # Magic values in assertions are acceptable in tests
    "PT009", # The maintained suites intentionally use unittest assertions
    "PT027", # Keep unittest exception assertions alongside pytest-style tests
    "SLF001", # Tests can access private members for white-box behavior checks
]

# These files run standalone; packaging them changes their sibling imports.
"tests/test_*.py" = ["INP001"]
"tests/ekf_appliances/test_*.py" = ["INP001", "S101"]
"tests/test_remote_announcements*.py" = ["S101"]
# This existing pytest module deliberately imports its sibling bridge directly.
"docker/chatgpt-web/test_bridge.py" = ["S101", "INP001"]

# The system service and Kodi load these stable entry-point paths directly.
"scripts/host/ha-host-actions.py" = ["N999"]
"scripts/host/ha-mdns-publish.py" = ["N999"]
"scripts/host/kodi/plugin.video.hayoutube/default.py" = ["INP001"]
# Actual Home Assistant scene cases use pytest-rewritten assertions.
"tests/evening_scene/test_*.py" = ["S101"]

[lint.isort]
# The HACS-managed namespace may be absent in a source-only checkout.
known-first-party = ["custom_components"]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

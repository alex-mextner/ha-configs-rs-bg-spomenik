# Managed by debian-tweaks (systemd-units): edit units/system/compose@hypercalinvntrmru.service.d/10-start-only.conf, not this file.
# HyperCalendarBot (/srv/compose/hypercalinvntrmru -> /opt/hypercal): its deploy wrapper (runner bananapi-hcb) owns
# which image the bot runs. Boot and reload never recreate an existing container (a plain `up` would replace
# hypercal-bot from :latest and lose its container logs); they only create a missing one (after a restore), so the unit
# does not fail and stall the other bots' units. A created bot runs the release the receipt releases/current.json
# names (`:<revision>`, kept by the deploy's image retention), never the compose file's `:latest`: that alias is moved
# only after a verified deploy and best effort, so it can name an older release than the schema. No receipt (before
# the first deploy): `:latest`. A receipt without a valid revision fails the unit rather than guess. The override is
# written again on every reload, after a deploy has moved the receipt. Stop keeps the containers (`stop`, not `down`).
[Service]
RuntimeDirectory=compose-%i
ExecStartPre=/bin/sh -c 'if [ -e releases/current.json ]; then rev=$$(jq -er .revision releases/current.json) && [ $${#rev} -eq 40 ] && case $$rev in *[!0-9a-f]*) false ;; esac || { echo "releases/current.json names no revision" >&2; exit 1; }; else rev=latest; fi; printf "services:\\n  bot:\\n    image: ghcr.io/alex-mextner/hypercalendarbot:%%s\\n" "$$rev" >%t/compose-%i/image.yml'
ExecStart=
ExecStart=/usr/bin/docker compose --project-name %i -f compose.yaml -f %t/compose-%i/image.yml up --detach --no-recreate --pull never
ExecReload=
ExecReload=/bin/sh -c 'if [ -e releases/current.json ]; then rev=$$(jq -er .revision releases/current.json) && [ $${#rev} -eq 40 ] && case $$rev in *[!0-9a-f]*) false ;; esac || { echo "releases/current.json names no revision" >&2; exit 1; }; else rev=latest; fi; printf "services:\\n  bot:\\n    image: ghcr.io/alex-mextner/hypercalendarbot:%%s\\n" "$$rev" >%t/compose-%i/image.yml'
ExecReload=/usr/bin/docker compose --project-name %i -f compose.yaml -f %t/compose-%i/image.yml up --detach --no-recreate --pull never
ExecStop=
ExecStop=/usr/bin/docker compose --project-name %i stop

# After changing recipients: `sops updatekeys secrets/secrets.sops.yaml`.
keys:
  # Admin: public half of the key in ~/.config/sops/age/keys.txt (the private one stays with the owner)
  - &admin age17a82sdcw2rwalp5vkhz24n66kv6y53qcz0dk23japt0pp390as7sq32ze0
  # odroidn2: ssh-to-age of its /etc/ssh/ssh_host_ed25519_key.pub, the Armbian install's host key, which
  # MIGRATION.md carries over to NixOS.
  - &odroidn2 age14mdcjuajat07jdg3gu74qjl2jfw8sf4ytjkuseeevhqrxmnwt9aqsxdwf9
creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:

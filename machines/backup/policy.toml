# Backup policy shared by every host: read by nixos.nix (builtins.fromTOML) and by debian/run (tomllib).
# Change it here only; both kinds of host pick it up on the next rebuild / `install.sh --commit`.

# rclone remote (section name in rclone.conf) and the top-level Drive folder of each host, <folder_prefix>-<host>:
# <remote>:<folder_prefix>-<host>/restic is the host's restic repository, .../tasks the off-site copy of the Tasks
# backups (ubuntu-pc). One folder per host and no shared parent: every host's token comes from its own Google
# Cloud project with scope drive.file and sees only the folders that project created (README.md, Secrets).
remote = "gdrive"
folder_prefix = "homelab-backup"

[retention]
keep_daily = 7
keep_weekly = 4
keep_monthly = 12

[check]
# share of the pack files `restic check` downloads and verifies every week
read_data_subset = "5%"

# systemd OnCalendar expressions; the time zone is explicit, so a host on UTC still runs at 04:00 Belgrade time
[schedule]
backup = "*-*-* 04:00:00 Europe/Belgrade"
backup_randomized_delay = "10min"
check = "Sun *-*-* 05:30:00 Europe/Belgrade"
drill = "*-*-01 06:30:00 Europe/Belgrade"
# the Tasks puller runs hourly at :00 plus up to 5 minutes of random delay
tasks = "*-*-* *:35:00"
# hosts with a `watch` list (ubuntu-pc): look at the other hosts' newest snapshot in the Drive
watch = "*-*-* 09:00:00 Europe/Belgrade"

[watch]
# a watched host whose newest snapshot or last run is older than this is reported: one missed night plus 12 hours
max_age_hours = 36

[restic]
# static build for Debian/Ubuntu hosts (NixOS uses nixpkgs' restic): homelab-backup needs restic 0.17 or newer
# (--retry-lock, exit code 10 "no repository"), older than what Debian 12 / Ubuntu 22.04 ship.
# Sums from https://github.com/restic/restic/releases/download/v0.19.1/SHA256SUMS
version = "0.19.1"
sha256.amd64 = "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c"
sha256.arm64 = "a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465"

[rclone]
# static build for Debian/Ubuntu hosts (NixOS uses nixpkgs' rclone); sums from https://downloads.rclone.org/v1.76.0/SHA256SUMS
version = "1.76.0"
sha256.amd64 = "b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7"
sha256.arm64 = "ee169016675e23a69d77240565133ff7dbc9b33d16fa8f7053d4af39f1eaeb78"

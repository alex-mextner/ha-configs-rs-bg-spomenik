# Projector power is observed through the matching MStar HDMI display on the ODROID.
# Unknown reads never trigger another lifecycle action. Shutdown waits for a stable
# display after boot and confirms POWER only while that display is still present.

command_line:
  - binary_sensor:
      name: Projector HDMI connected
      unique_id: projector_hdmi_connected
      device_class: connectivity
      # Keep polling lightweight while the media host is under I/O pressure.
      command: >-
        read -r link_status < /sys/class/drm/card0-HDMI-A-1/status || exit 1;
        case "$link_status" in
        disconnected) printf disconnected ;;
        connected) edid_id=$(od -An -tx1 -N16 /sys/class/drm/card0-HDMI-A-1/edid) || exit 1;
        set -- $edid_id;
        if [ "$*" = "00 ff ff ff ff ff ff 00 36 74 30 00 01 00 00 00" ];
        then printf connected; else printf unknown; fi ;;
        *) printf unknown ;;
        esac
      payload_on: connected
      payload_off: disconnected
      scan_interval: 2
      command_timeout: 5

input_boolean:
  # Compatibility mirror for older source routing. Never used as power feedback.
  projector_power:
    name: Projector power (HDMI observed)
    icon: mdi:projector

script:
  # Keep these sequence hooks for existing callers and the EKF config entry.
  # No helper is changed until the HDMI sensor observes the physical transition.
  projector_turn_on:
    alias: Projector turn on
    mode: single
    sequence:
      - condition: state
        entity_id: binary_sensor.projector_hdmi_connected
        state: "off"
      - action: button.press
        target: { entity_id: button.projector_power }
      - wait_template: "{{ is_state('binary_sensor.projector_hdmi_connected', 'on') }}"
        timeout: "00:00:35"
        continue_on_timeout: false

  projector_turn_off:
    alias: Projector turn off
    mode: single
    sequence:
      - condition: state
        entity_id: binary_sensor.projector_hdmi_connected
        state: "on"
      # HDMI appears before the projector accepts another power command.
      # One delayed request is held until the matching display has been stable.
      - delay:
          seconds: >-
            {{ [0, 30 - (now() - states.binary_sensor.projector_hdmi_connected.last_changed).total_seconds()] | max | round(0, 'ceil') }}
      - action: homeassistant.update_entity
        target: { entity_id: binary_sensor.projector_hdmi_connected }
      - condition: template
        value_template: >-
          {{ is_state('binary_sensor.projector_hdmi_connected', 'on')
             and (now() - states.binary_sensor.projector_hdmi_connected.last_changed).total_seconds() >= 30 }}
      - action: button.press
        target: { entity_id: button.projector_power }
      - delay: "00:00:03"
      - action: homeassistant.update_entity
        target: { entity_id: binary_sensor.projector_hdmi_connected }
      - condition: state
        entity_id: binary_sensor.projector_hdmi_connected
        state: "on"
      - action: button.press
        target: { entity_id: button.projector_power }
      - wait_template: "{{ is_state('binary_sensor.projector_hdmi_connected', 'off') }}"
        timeout: "00:00:35"
        continue_on_timeout: false

  projector_toggle:
    alias: Projector power
    mode: single
    sequence:
      - action: media_player.toggle
        target: { entity_id: media_player.projector }

automation:
  # The helper is the last observed state, not a guessed power state. Leaving it
  # unchanged during a failed read prevents unknown -> on from restarting Kodi.
  - alias: Projector power follows HDMI
    id: projector_power_follows_source
    mode: queued
    trigger:
      - platform: state
        entity_id: binary_sensor.projector_hdmi_connected
        to: "on"
      - platform: state
        entity_id: binary_sensor.projector_hdmi_connected
        to: "off"
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: "{{ states('binary_sensor.projector_hdmi_connected') in ['on', 'off'] }}"
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.projector_hdmi_connected
                state: "on"
              - condition: template
                value_template: >-
                  {{ not is_state('input_boolean.projector_power', 'on')
                     or trigger.platform == 'homeassistant' }}
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.projector_power }
              - action: rest_command.host_projector_on
              - action: input_text.set_value
                target: { entity_id: input_text.tv_source }
                data: { value: projector }
          - conditions:
              - condition: state
                entity_id: binary_sensor.projector_hdmi_connected
                state: "off"
              - condition: state
                entity_id: input_boolean.projector_power
                state: "on"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.projector_power }
              - if: "{{ is_state('input_text.tv_source', 'projector') }}"
                then:
                  - action: rest_command.host_projector_off
                  # Restore remote routing without sending TV input or power keys.
                  - action: input_text.set_value
                    target: { entity_id: input_text.tv_source }
                    data: { value: chromecast }
# Alice can acknowledge the request while HDMI confirms the slow transition.
yandex_smart_home:
  entity_config:
    media_player.projector:
      slow: true

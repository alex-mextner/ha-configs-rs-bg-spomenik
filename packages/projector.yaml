# Projector power helper and Kodi/source automation.
#
# The EKF Appliances integration provides the media player and the twelve
# button.projector_* IR controls through remote.ekf_connect_ir. Keep these
# script/entity IDs stable for existing dashboards, automations and Alice.
# Power is assumed because the projector does not report its state over IR.
# Turning off requires two power frames, three seconds apart.

input_boolean:
  projector_power:
    name: Projector power (assumed)
    icon: mdi:projector

script:
  # One power frame = turn on. Mark assumed-on.
  projector_turn_on:
    alias: Projector turn on
    mode: single
    sequence:
      - action: button.press
        target: { entity_id: button.projector_power }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.projector_power }

  # The projector requires a double power press ~3s apart to power off
  # (single press just shows the "press again to power off" OSD). Mirror
  # that here so a single media_player.turn_off actually powers it down.
  projector_turn_off:
    alias: Projector turn off
    mode: single
    sequence:
      - action: button.press
        target: { entity_id: button.projector_power }
      - delay: "00:00:03"
      - action: button.press
        target: { entity_id: button.projector_power }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.projector_power }

  projector_toggle:
    alias: Projector toggle
    mode: single
    sequence:
      - choose:
          - conditions: "{{ is_state('input_boolean.projector_power', 'on') }}"
            sequence:
              - action: script.projector_turn_off
        default:
          - action: script.projector_turn_on

automation:
  # Projector power drives the PC display/Kodi helper and the active source.
  # Turning the projector on wakes/unlocks the desktop and starts Kodi, then
  # marks the source as projector. Turning it off stops Kodi and locks the
  # desktop. Only reverts TV source to chromecast if projector was actually
  # active, so a background power correction does not hijack pc/chromecast.
  # tv_source + source_to_chromecast live in universal_remote; packages merge.
  - alias: Projector power follows source
    id: projector_power_follows_source
    mode: queued
    trigger:
      - platform: state
        entity_id: input_boolean.projector_power
        from: "off"
        to: "on"
        id: "on"
      - platform: state
        entity_id: input_boolean.projector_power
        from: "on"
        to: "off"
        id: "off"
    action:
      - choose:
          - conditions: "{{ trigger.id == 'on' }}"
            sequence:
              - action: rest_command.host_projector_on
              - action: input_text.set_value
                target: { entity_id: input_text.tv_source }
                data: { value: projector }
          - conditions: "{{ trigger.id == 'off' }}"
            sequence:
              - action: rest_command.host_projector_off
              - if: "{{ is_state('input_text.tv_source', 'projector') }}"
                then:
                  - action: script.source_to_chromecast

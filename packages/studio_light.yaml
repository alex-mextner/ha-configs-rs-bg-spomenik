# Студия: одна лампа Яндекса (light.studiia), питание которой режет реле Aqara
# (light.studio_sw). При выключении реле лампа обесточивается, при включении загружается
# с прошлой яркостью/цветом. Этот пакет склеивает их в одну сущность light.studio
# ("Студия") и после каждого включения питания возвращает белый свет по времени суток
# (правило — custom_templates/light_defaults.jinja):
#   день 06:00-22:59 → 100 %, 4000 K; ночь 23:00-05:59 → 50 %, 2700 K.
# light.studio_sw и light.studiia скрыты в реестре сущностей (hidden_by=user), в Алису
# уходит только light.studio (options фильтра интеграции yandex_smart_home).
#
# Гонка «сброс против явной яркости» исключена: вся логика включения живёт в одном
# скрипте script.studio_light_set (mode: restart). Шаблонный свет только запускает его
# (с явными brightness/color_temp_kelvin, если они пришли в вызове), а автоматизация
# «реле off→on» (физический щелчок и т.п.) запускает его БЕЗ явных значений и только если
# скрипт сейчас не выполняется. Реле включает сам скрипт, поэтому его собственное off→on
# автоматизацию не запускает. Явный вызов во время сброса перезапускает скрипт и выигрывает.
#
# Задержка (замерено 2026-10-22): лампа начинает принимать команды примерно через 5 с после
# подачи питания (загрузка + wifi + облако). Команда, отправленная раньше, облаком
# принимается ("ok"), но до лампы не доходит, а облако при этом часто вообще не помечает
# лампу unavailable, так что ждать перехода состояния нельзя. Поэтому после подачи питания
# скрипт повторяет «применить → секунда → обновить состояние из облака → сверить» до
# совпадения (максимум 12 попыток ≈ 25 с); цвет и яркость на каждой попытке уходят ОДНИМ
# запросом (сцена «Белый»/«Мягкий белый» + brightness). Если лампа не вернулась за 12
# попыток, скрипт молча заканчивается — лампа остаётся в своём запомненном состоянии.
# Быстрее ~5 с физически нельзя: до этого лампа просто не на связи.
# Если лампа уже включена, команда уходит один раз без проверки.
#
# Особенности yandex_station (light.py): light.turn_on с color_temp_kelvin ИГНОРИРУЕТ
# brightness из того же вызова (early return), поэтому для явной температуры от Алисы цвет
# и яркость отправляются двумя вызовами. Лампа не отдаёт color_temp_kelvin обратно — белый
# приходит как сцена с hs_color, поэтому у light.studio температура в UI неизвестна.

script:
  studio_light_set:
    alias: "Студия: включить и применить яркость/белый"
    description: >-
      Включает реле, применяет яркость и цвет, после подачи питания повторяет до подтверждения
      облаком. Явные brightness/color_temp_kelvin (0 = не заданы) побеждают сброс по времени
      суток. Сброс (белый + яркость по времени) делается только после подачи питания
      (реле было выключено, лампа unavailable, лампа выключена или power_reset).
    mode: restart
    fields:
      brightness:
        description: "Яркость 1-255; 0 или не задано — без явной яркости"
        example: 128
      color_temp_kelvin:
        description: "Цветовая температура, K; 0 или не задано — без явной"
        example: 3000
      power_reset:
        description: "true — реле только что включили снаружи (физическая кнопка и т.п.)"
        example: false
    sequence:
      - variables:
          want_b: "{{ brightness | default(0) | int(0) }}"
          want_k: "{{ color_temp_kelvin | default(0) | int(0) }}"
          powering_up: >-
            {{ (power_reset | default(false))
               or is_state('light.studio_sw', 'off')
               or is_state('light.studiia', 'unavailable') }}
          reset_defaults: >-
            {{ powering_up or is_state('light.studiia', 'off') }}
      - variables:
          # Сцена «Белый»/«Мягкий белый» — только для сброса без явной температуры.
          use_scene: "{{ want_k == 0 and reset_defaults }}"
          target_effect: >-
            {% from 'light_defaults.jinja' import white_effect %}
            {{ white_effect() if use_scene else '' }}
          # 0 = яркость не применять. Явное значение побеждает сброс по времени суток.
          target_b: >-
            {% from 'light_defaults.jinja' import brightness255 %}
            {{ want_b if want_b > 0 else (brightness255() | int if reset_defaults else 0) }}
          calls: >-
            {% if use_scene %}
              {{ [{'effect': target_effect, 'brightness': target_b}] }}
            {% else %}
              {% set l = [] %}
              {% if want_k > 0 %}{% set l = l + [{'color_temp_kelvin': want_k}] %}{% endif %}
              {% if target_b > 0 %}{% set l = l + [{'brightness': target_b}] %}{% endif %}
              {{ l }}
            {% endif %}
      - if:
          - condition: state
            entity_id: light.studio_sw
            state: "off"
        then:
          - action: light.turn_on
            target:
              entity_id: light.studio_sw
      - if: "{{ calls | length > 0 }}"
        then:
          - if: "{{ powering_up }}"
            then:
              - repeat:
                  sequence:
                    - repeat:
                        for_each: "{{ calls }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: light.studiia
                            data: "{{ repeat.item }}"
                            continue_on_error: true
                    - delay: "00:00:01"
                    - action: homeassistant.update_entity
                      target:
                        entity_id: light.studiia
                      continue_on_error: true
                  until:
                    - condition: template
                      value_template: >-
                        {{ repeat.index >= 12 or (
                             is_state('light.studiia', 'on')
                             and (target_b == 0
                                  or (state_attr('light.studiia', 'brightness') | int(0) - target_b) | abs <= 5)
                             and (target_effect == ''
                                  or state_attr('light.studiia', 'effect') == target_effect)) }}
            else:
              - repeat:
                  for_each: "{{ calls }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.studiia
                      data: "{{ repeat.item }}"

template:
  - light:
      - unique_id: studio_light_wrapper
        name: Студия
        default_entity_id: light.studio
        # Состояние и доступность — только по реле: лампа в unavailable при обесточенном реле.
        state: "{{ is_state('light.studio_sw', 'on') }}"
        availability: "{{ not is_state('light.studio_sw', ['unavailable', 'unknown']) }}"
        level: >-
          {{ state_attr('light.studiia', 'brightness') | int(255)
             if is_state('light.studiia', 'on') else 255 }}
        temperature: >-
          {% set k = state_attr('light.studiia', 'color_temp_kelvin') %}
          {{ [[(1000000 / k) | round(0), 153] | max, 500] | min if k else none }}
        turn_on: &studio_light_on
          - action: script.turn_on
            target:
              entity_id: script.studio_light_set
            data:
              variables:
                brightness: "{{ brightness | default(0) }}"
                color_temp_kelvin: "{{ color_temp_kelvin | default(0) }}"
        set_level: *studio_light_on
        set_temperature: *studio_light_on
        turn_off:
          - action: script.turn_off
            target:
              entity_id: script.studio_light_set
          - action: light.turn_off
            target:
              entity_id: light.studio_sw

automation:
  - id: studio_light_reset_on_power
    alias: "Студия: белый по времени суток при включении реле"
    description: >-
      Реле light.studio_sw off→on из любого источника (кроме самого скрипта/шаблонного света):
      запускает скрипт со сбросом. Явные значения шаблонного света запускают скрипт сами.
    mode: single
    triggers:
      - trigger: state
        entity_id: light.studio_sw
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: script.studio_light_set
        state: "off"
    actions:
      - action: script.turn_on
        target:
          entity_id: script.studio_light_set
        data:
          variables:
            power_reset: true

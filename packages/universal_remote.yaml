# Living-room universal remote. Device integrations own their hardware;
# the integration publishes the canonical target and mirrors legacy helpers.
input_select:
  universal_remote_pair:
    name: Пульт — телевизор или проектор
    options: [tv, projector]
    initial: tv
    icon: mdi:remote
input_text:
  universal_remote_input_ms:
    name: Пульт — ожидающее нажатие INPUT
    max: 16
    initial: "0"
  universal_remote_input_context:
    name: Пульт — режим при первом INPUT
    max: 255
    initial: "{}"
  universal_remote_focus_seconds:
    name: Пульт — длительность фокуса
    max: 3
    initial: "60"
  universal_remote_wake_context:
    name: Пульт — запрос включения пары
    max: 255
    initial: "{}"
  universal_remote_projector_until_ms:
    name: Пульт — срок выбранного режима
    max: 16
    initial: "0"
  audio_last_press_ms:
    name: Audio last press (ms)
    max: 16
    initial: "0"
    icon: mdi:gesture-double-tap
  audio_pending_tap_ms:
    name: Audio pending first tap (ms)
    max: 16
    initial: "0"
    icon: mdi:gesture-double-tap
  ac_last_mode:
    # Kept for external references; Amazon uses the outdoor temperature.
    name: AC last used mode
    max: 10
    initial: cool
    icon: mdi:air-conditioner
input_boolean:
  universal_remote_native_target:
    name: Пульт — меню самого экрана
    initial: false
    icon: mdi:television-settings
  nav_to_tv:
    # Legacy external helper; actual remote routing uses native_target.
    name: Nav routes to TV (legacy)
    initial: false
    icon: mdi:remote-tv
  audio_mode:
    # Double Audio selects the speaker. Explicit display selection, Audio, Back,
    # Exit or 60 seconds without a speaker control dismisses it.
    name: Audio mode (Yandex speaker)
    initial: false
    icon: mdi:speaker
  audio_was_playing:
    # Compatibility helper. Leaving Audio must not resume a requested pause.
    name: Audio mode — was playing at activation
    initial: false
    icon: mdi:play-pause
timer:
  universal_remote_projector:
    # Compatibility entity only; exact focus deadlines belong to the integration.
    name: Пульт — выбранный режим
    duration: "00:01:00"
    restore: false
script:
  # CH changes the setpoint in every remote mode. The climate entity keeps
  # an off appliance off and stores an off-state setpoint without sending IR.
  remote_ac_temperature:
    alias: Remote AC temperature step
    mode: queued
    max: 20
    fields:
      delta:
        description: Temperature steps (+1 or -1)
    sequence:
      - variables:
          current_target: "{{ state_attr('climate.kondei_1', 'temperature') }}"
      - if: >-
          {{ states('climate.kondei_1') in ['unknown', 'unavailable']
             or not is_number(current_target) }}
        then:
          - action: ekf_appliances.remote_reject
            data: { reason: ac_setpoint_unavailable }
          - stop: "AC setpoint is unavailable; temperature command was not sent"
            error: true
      - variables:
          next_target: >-
            {% set step = state_attr('climate.kondei_1', 'target_temp_step') | float(1) %}
            {% set low = state_attr('climate.kondei_1', 'min_temp') | float(16) %}
            {% set high = state_attr('climate.kondei_1', 'max_temp') | float(30) %}
            {{ [[current_target | float + (delta | int) * step, high] | min, low] | max }}
      - if: "{{ next_target | float != current_target | float }}"
        then:
          - action: climate.set_temperature
            target: { entity_id: climate.kondei_1 }
            data: { temperature: "{{ next_target }}" }
        else:
          - action: ekf_appliances.remote_reject
            data: { reason: ac_setpoint_limit }

  # One Amazon press sends one complete state. The outdoor weather temperature
  # selects heat below 24 C and cool at/above 24 C; indoor readings are not a fallback.
  remote_ac_toggle:
    alias: Remote AC power
    mode: single
    sequence:
      - choose:
          - conditions: "{{ is_state('climate.kondei_1', 'off') }}"
            sequence:
              - variables:
                  outdoor: "{{ state_attr('weather.forecast_home_assistant', 'temperature') }}"
                  outdoor_unit: "{{ state_attr('weather.forecast_home_assistant', 'temperature_unit') }}"
              - if: >-
                  {{ states('weather.forecast_home_assistant') in ['unknown', 'unavailable']
                     or not is_number(outdoor) or outdoor_unit != '°C' }}
                then:
                  - action: system_log.write
                    data:
                      level: error
                      message: "Remote AC: weather.forecast_home_assistant has no valid outdoor temperature in Celsius; no power command sent"
                  - action: ekf_appliances.remote_reject
                    data: { reason: ac_weather_unavailable }
                  - stop: "Outdoor temperature from weather.forecast_home_assistant is unavailable in Celsius; AC remains off"
                    error: true
              - action: climate.set_hvac_mode
                target: { entity_id: climate.kondei_1 }
                data:
                  hvac_mode: "{{ 'heat' if outdoor | float < 24 else 'cool' }}"
          - conditions: "{{ states('climate.kondei_1') in ['unknown', 'unavailable'] }}"
            sequence:
              - action: ekf_appliances.remote_reject
                data: { reason: ac_state_unavailable }
              - stop: "AC state is unavailable; power command was not sent"
                error: true
        default:
          - action: climate.turn_off
            target: { entity_id: climate.kondei_1 }

  # The integration owns mode, INPUT timing, focus expiry and wake intent.
  # Keep these public script names and helpers for existing callers.
  remote_mode_select_pair:
    alias: Пульт — выбрать пару
    mode: queued
    max: 20
    fields:
      pair:
        description: tv | projector
      native:
        description: Control the display instead of its player
      lease_seconds:
        description: Compatibility field; explicit focus is always 60 seconds
      explicit:
        description: False when following the observed power states
    sequence:
      - action: ekf_appliances.remote_select
        data:
          pair: "{{ pair }}"
          native: "{{ native | default(false) }}"
          explicit: "{{ explicit | default(true) }}"
        response_variable: route
      - stop: Return the canonical mode
        response_variable: route

  remote_pair_wake:
    alias: Пульт — включить выбранную пару
    mode: parallel
    max: 4
    fields:
      pair:
        description: Compatibility field; wake intent belongs to the controller
      wake_id:
        description: Compatibility token from an obsolete YAML waiter
    sequence:
      - action: ekf_appliances.remote_resolve
        response_variable: route
      - stop: Wake requests are owned by the canonical controller
        response_variable: route

  remote_input_single:
    alias: Пульт — одиночный INPUT
    mode: queued
    max: 20
    sequence:
      - action: ekf_appliances.remote_resolve
        response_variable: route
      - stop: INPUT decisions are owned by the canonical controller
        response_variable: route

  remote_input_finish:
    alias: Пульт — ожидание второго INPUT
    mode: parallel
    max: 10
    fields:
      press_ms:
        description: Compatibility timestamp from an obsolete YAML waiter
    sequence:
      - action: ekf_appliances.remote_resolve
        response_variable: route
      - stop: INPUT deadlines are owned by the canonical controller
        response_variable: route

  remote_modes_prepare:
    alias: Пульт — выбор получателя
    mode: queued
    max: 100
    fields:
      button:
        description: Logical key or compatibility callback
      received_ms:
        description: Physical reception timestamp, including fractional milliseconds
      expected_ms:
        description: Compatibility INPUT waiter timestamp
      wake_id:
        description: Compatibility wake token
    sequence:
      - action: ekf_appliances.remote_prepare
        data:
          button: "{{ button }}"
          received_ms: "{{ received_ms | default(none) }}"
          expected_ms: "{{ expected_ms | default(0) | float }}"
          wake_id: "{{ wake_id | default('') | string }}"
        response_variable: route
      - stop: Return the canonical mode
        response_variable: route

  remote_nav:
    alias: Remote nav dispatcher
    mode: queued
    max: 30
    fields:
      direction:
        description: up | down | left | right | ok | back | menu | home | exit | info | guide
      pair:
        description: tv | projector
      native:
        description: Control the display menu instead of its player
    sequence:
      - action: ekf_appliances.remote_resolve
        data: >-
          {% set request = {} %}
          {% if pair is defined %}{% set request = dict(request, pair=pair) %}{% endif %}
          {% if native is defined %}{% set request = dict(request, native=native) %}{% endif %}
          {{ request }}
        response_variable: route
      - variables:
          selected_pair: "{{ pair | default(route.pair) }}"
          selected_native: "{{ native | default(route.native) }}"
          kodi_map:
            up: Input.Up
            down: Input.Down
            left: Input.Left
            right: Input.Right
            ok: Input.Select
            back: Input.Back
            exit: Input.Back
            menu: Input.ContextMenu
            info: Input.Info
            guide: Input.ShowOSD
          samsung_map:
            up: KEY_UP
            down: KEY_DOWN
            left: KEY_LEFT
            right: KEY_RIGHT
            ok: KEY_ENTER
            back: KEY_RETURN
            exit: KEY_EXIT
            menu: KEY_MENU
            home: KEY_CONTENTS
            info: KEY_INFO
            guide: KEY_GUIDE
          atv_map:
            up: KEYCODE_DPAD_UP
            down: KEYCODE_DPAD_DOWN
            left: KEYCODE_DPAD_LEFT
            right: KEYCODE_DPAD_RIGHT
            ok: KEYCODE_DPAD_CENTER
            back: KEYCODE_BACK
            exit: KEYCODE_HOME
            menu: KEYCODE_MENU
            home: KEYCODE_HOME
            info: KEYCODE_INFO
            guide: KEYCODE_GUIDE
          projector_map:
            up: button.projector_up
            down: button.projector_down
            left: button.projector_left
            right: button.projector_right
            ok: button.projector_ok
            back: button.projector_back
            exit: button.projector_back
            menu: button.projector_menu
            home: button.projector_menu
      - choose:
          - conditions: "{{ selected_pair == 'projector' and selected_native }}"
            sequence:
              - if: "{{ direction not in projector_map }}"
                then:
                  - action: ekf_appliances.remote_reject
                    data: { reason: unsupported_projector_key }
                  - stop: This projector has no verified command for that key
                    error: true
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: button
                  service: press
                  pair: projector
                  service_data:
                    entity_id:
                    - "{{ projector_map[direction] }}"
          - conditions: "{{ selected_pair == 'projector' }}"
            sequence:
              - choose:
                  - conditions: "{{ direction == 'home' }}"
                    sequence:
                      - action: ekf_appliances.remote_dispatch
                        data:
                          domain: kodi
                          service: call_method
                          pair: projector
                          service_data:
                            entity_id: media_player.home
                            method: GUI.ActivateWindow
                            window: home
                default:
                  - action: ekf_appliances.remote_dispatch
                    data:
                      domain: kodi
                      service: call_method
                      pair: projector
                      service_data:
                        entity_id: media_player.home
                        method: "{{ kodi_map[direction] }}"
          - conditions: "{{ selected_native }}"
            sequence:
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: remote
                  service: send_command
                  pair: tv
                  service_data:
                    entity_id: [remote.ue48j5500_ue48j5500]
                    command: "{{ samsung_map[direction] }}"
                    delay_secs: 0
        default:
          - action: ekf_appliances.remote_dispatch
            data:
              domain: remote
              service: send_command
              pair: tv
              service_data:
                entity_id: [remote.televizor]
                command: "{{ atv_map[direction] }}"
                delay_secs: 0

  remote_volume:
    alias: Remote volume dispatcher
    mode: queued
    max: 30
    fields:
      command:
        description: volume_up | volume_down | mute
      pair:
        description: tv | projector
      native:
        description: Control the display instead of its player
    sequence:
      - action: ekf_appliances.remote_resolve
        data: >-
          {% set request = {} %}
          {% if pair is defined %}{% set request = dict(request, pair=pair) %}{% endif %}
          {% if native is defined %}{% set request = dict(request, native=native) %}{% endif %}
          {{ request }}
        response_variable: route
      - variables:
          selected_pair: "{{ pair | default(route.pair) }}"
          selected_native: "{{ native | default(route.native) }}"
          projector_buttons:
            volume_up: button.projector_vol_up
            volume_down: button.projector_vol_down
            mute: button.projector_mute
          target_player: >-
            {{ 'media_player.home' if selected_pair == 'projector'
               else 'media_player.ue48j5500_ue48j5500_network' if selected_native
               else 'media_player.ue48j5500_ue48j5500' }}
      - choose:
          - conditions: "{{ selected_pair == 'projector' and selected_native }}"
            sequence:
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: button
                  service: press
                  pair: projector
                  service_data:
                    entity_id:
                    - "{{ projector_buttons[command] }}"
          - conditions: "{{ selected_pair == 'tv' and selected_native }}"
            sequence:
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: remote
                  service: send_command
                  pair: tv
                  service_data:
                    entity_id: [remote.ue48j5500_ue48j5500]
                    command: "{{ {'volume_up': 'KEY_VOLUP', 'volume_down': 'KEY_VOLDOWN', 'mute': 'KEY_MUTE'}[command] }}"
                    delay_secs: 0
          - conditions: "{{ command == 'mute' }}"
            sequence:
              - if: "{{ state_attr(target_player, 'is_volume_muted') is not boolean }}"
                then:
                  - action: ekf_appliances.remote_reject
                    data: { reason: unknown_mute_state }
                  - stop: Player mute state is unknown; no toggle was guessed
                    error: true
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: media_player
                  service: volume_mute
                  pair: "{{ selected_pair }}"
                  service_data:
                    is_volume_muted: "{{ not state_attr(target_player, 'is_volume_muted') }}"
                    entity_id:
                    - "{{ target_player }}"
        default:
          - action: ekf_appliances.remote_dispatch
            data:
              domain: media_player
              service: "{{ command }}"
              pair: "{{ selected_pair }}"
              service_data:
                entity_id:
                - "{{ target_player }}"

  remote_media:
    alias: Remote media transport
    mode: queued
    max: 20
    fields:
      action:
        description: play_pause | previous | next
      pair:
        description: tv | projector
    sequence:
      - action: ekf_appliances.remote_resolve
        data: >-
          {% set request = {} %}
          {% if pair is defined %}{% set request = dict(request, pair=pair) %}{% endif %}
          {% if native is defined %}{% set request = dict(request, native=native) %}{% endif %}
          {{ request }}
        response_variable: route
      - variables:
          selected_pair: "{{ pair | default(route.pair) }}"
          media_actions:
            play_pause: media_play_pause
            previous: media_previous_track
            next: media_next_track
      - action: ekf_appliances.remote_dispatch
        data:
          domain: media_player
          service: "{{ media_actions[action] }}"
          pair: "{{ selected_pair }}"
          service_data:
            entity_id:
            - "{{ 'media_player.home' if selected_pair == 'projector' else 'media_player.ue48j5500_ue48j5500' }}"

  # Kodi: resume next episode of the last in-progress show.
  kodi_play_next_episode:
    alias: Kodi play next episode
    mode: single
    sequence:
      - action: ekf_appliances.remote_dispatch
        data:
          domain: kodi
          service: call_method
          pair: projector
          return_response: true
          service_data:
            entity_id: media_player.home
            method: VideoLibrary.GetInProgressTVShows
            properties:
            - title
            - lastplayed
            sort:
              order: descending
              method: lastplayed
        response_variable: shows_resp
      - if: "{{ shows_resp.blocked | default('') != '' }}"
        then:
          - stop: Library request was rejected before dispatch
      - choose:
          - conditions: "{{ (shows_resp.tvshows | default([])) | length > 0 }}"
            sequence:
              - variables:
                  show_id: "{{ shows_resp.tvshows[0].tvshowid }}"
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: kodi
                  service: call_method
                  pair: projector
                  return_response: true
                  service_data:
                    entity_id: media_player.home
                    method: VideoLibrary.GetEpisodes
                    tvshowid: "{{ show_id }}"
                    properties:
                    - title
                    - playcount
                    - resume
                    - file
                    - season
                    - episode
                    sort:
                      order: ascending
                      method: episode
                response_variable: eps_resp
              - if: "{{ eps_resp.blocked | default('') != '' }}"
                then:
                  - stop: Episode request was rejected before dispatch
              - variables:
                  # First episode with playcount == 0 or a non-zero resume position.
                  next_ep: >-
                    {% set eps = eps_resp.episodes | default([]) %}
                    {% set cand = eps | selectattr('playcount', 'equalto', 0) | list %}
                    {{ cand[0] if cand | length > 0 else (eps[-1] if eps | length > 0 else none) }}
              - choose:
                  - conditions: "{{ next_ep != none }}"
                    sequence:
                      - action: ekf_appliances.remote_dispatch
                        data:
                          domain: kodi
                          service: call_method
                          pair: projector
                          service_data:
                            entity_id: media_player.home
                            method: Player.Open
                            item:
                              episodeid: "{{ next_ep.episodeid }}"
        default:
          # No in-progress shows: fallback to resume, then open Kodi home.
          - action: ekf_appliances.remote_dispatch
            data:
              domain: media_player
              service: media_play
              pair: projector
              service_data:
                entity_id:
                - media_player.home

  # Compatibility names now address permanently connected pairs.
  # They no longer switch TV HDMI inputs or shut down the other pair.
  source_to_chromecast:
    alias: Source → Chromecast
    mode: single
    sequence:
      - action: script.remote_mode_select_pair
        data: { pair: tv }
      - action: ekf_appliances.remote_dispatch
        data:
          domain: media_player
          service: turn_on
          pair: tv
          service_data:
            entity_id: [media_player.ue48j5500_ue48j5500]
        response_variable: result
      - stop: Return the source power admission
        response_variable: result
  source_to_pc:
    alias: Source → Kodi and projector
    mode: single
    sequence:
      - action: script.source_to_projector
        response_variable: result
      - stop: Return the named projector source admission
        response_variable: result
  source_to_projector:
    alias: Source → projector
    mode: single
    sequence:
      - action: script.remote_mode_select_pair
        data: { pair: projector }
      - action: ekf_appliances.remote_dispatch
        data:
          domain: media_player
          service: turn_on
          pair: projector
          service_data:
            entity_id:
            - media_player.projector
        response_variable: result
      - stop: Return the source power admission
        response_variable: result
  app_launch_on_chromecast:
    alias: Launch app on Chromecast
    mode: single
    fields:
      activity:
        description: Android package or deep-link URL
    sequence:
      - action: script.source_to_chromecast
        response_variable: source_result
      - if: "{{ source_result.sent | default(false) is not sameas true }}"
        then:
          - stop: Source power request was rejected
      - action: ekf_appliances.remote_dispatch
        data:
          domain: remote
          service: turn_on
          pair: tv
          service_data:
            entity_id: [remote.televizor]
            # Preserve direct content URLs and the supported app links.
            activity: >-
              {{ {'com.netflix.ninja': 'netflix://',
                  'com.google.android.youtube.tv': 'https://www.youtube.com'}.get(activity, activity) }}
  guide_toggle:
    alias: Guide (compatibility)
    mode: single
    sequence:
      - action: script.remote_nav
        data: { direction: guide }

  # Compatibility helper only. Normal remote flow uses the regular OK event;
  # this script is kept so external callers no longer touch deleted T9 helpers.
  t9_commit:
    alias: T9 commit (submit)
    mode: parallel
    max: 100
    sequence:
      - action: ekf_appliances.remote_resolve
        data: >-
          {% set request = {} %}
          {% if pair is defined %}{% set request = dict(request, pair=pair) %}{% endif %}
          {% if native is defined %}{% set request = dict(request, native=native) %}{% endif %}
          {{ request }}
        response_variable: route
      # Capture the target now; each transport has one ordered write queue.
      - action: script.t9_send_char
        data:
          mode: commit
          pair: "{{ pair | default(route.pair) }}"
          native: "{{ native | default(route.native) }}"

  # Enter the native FIFO immediately so queued keys capture its current app
  # generation. Kodi HTTP operations use their own shared queue below.
  t9_send_char:
    alias: T9 send char
    mode: parallel
    max: 100
    fields:
      char:
        description: "a-z, space, 1; used by add and cycle"
      mode:
        description: "add | cycle | backspace | commit"
    sequence:
      - action: ekf_appliances.remote_resolve
        data: >-
          {% set request = {} %}
          {% if pair is defined %}{% set request = dict(request, pair=pair) %}{% endif %}
          {% if native is defined %}{% set request = dict(request, native=native) %}{% endif %}
          {{ request }}
        response_variable: route
      - variables:
          source: "{{ 'projector' if (pair | default(route.pair)) == 'projector' else 'chromecast' }}"
      - if: "{{ mode not in ['add', 'cycle', 'backspace', 'commit'] }}"
        then:
          - action: ekf_appliances.remote_reject
            data: { reason: unsupported_text_operation }
          - stop: Unsupported T9 text operation
            error: true
      - choose:
          - conditions: "{{ native | default(route.native) }}"
            sequence:
              - if: "{{ mode in ['backspace', 'commit'] }}"
                then:
                  - action: ekf_appliances.remote_reject
                    data: { reason: text_edit_requires_player }
                  - stop: Text editing is available only in the player target
              - if: "{{ source == 'projector' }}"
                then:
                  - action: ekf_appliances.remote_reject
                    data: { reason: unsupported_projector_digit }
                  - stop: This projector has no verified numeric keypad
                    error: true
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: remote
                  service: send_command
                  pair: tv
                  service_data:
                    entity_id: [remote.ue48j5500_ue48j5500]
                    command: "KEY_{{ digit }}"
                    delay_secs: 0
          - conditions: "{{ source == 'chromecast' }}"
            sequence:
              # One ordered relative input batch per physical operation. Keeping text
              # in a dictionary preserves literal space and the string digit "1".
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: androidtv_remote
                  service: send_text
                  pair: tv
                  return_response: true
                  service_data: >-
                    {{ {'entity_id': ['remote.televizor'],
                        'operation': {'add': 'insert', 'cycle': 'replace_previous',
                                      'backspace': 'delete_backward', 'commit': 'submit'}[mode],
                        'text': (' ' if (char | default('') | string) == 'space'
                                 else (char | default('') | string))} }}
                response_variable: chromecast_text_result
              - if: "{{ chromecast_text_result.blocked | default('') != '' }}"
                then:
                  - stop: Text command was rejected before native dispatch
              - if: >-
                  {% set response = chromecast_text_result | default({}) %}
                  {% set body = response.get('remote.televizor', {})
                     if response is mapping else {} %}
                  {{ body is not mapping or body.get('sent') is not sameas true
                     or body.get('verified') is not sameas false }}
                then:
                  - action: ekf_appliances.remote_reject
                    data: { reason: native_text_rejected }
                  - stop: Chromecast physical text input was not sent by the native integration
                    error: true
          - conditions: "{{ source in ['pc', 'projector'] }}"
            sequence:
              # Keep 'space' logical until the JSON payload: HA trims a template
              # whose whole result is whitespace. SendText would replace the word.
              - action: script.t9_kodi_text
                data:
                  mode: "{{ mode }}"
                  char: "{{ char | default('') | string }}"
                response_variable: kodi_text_result
              - if: "{{ kodi_text_result.blocked | default('') != '' }}"
                then:
                  - stop: Text command was rejected before native dispatch
              - if: >-
                  {% set body = kodi_text_result.content | default({}) %}
                  {{ kodi_text_result.status | default(0) != 200
                     or body is not mapping
                     or body.get('ok') is not sameas true
                     or body.get('verified') is not sameas true }}
                then:
                  - action: ekf_appliances.remote_reject
                    data: { reason: kodi_text_rejected }
                  - stop: Kodi text edit was not confirmed by the host
                    error: true

  t9_kodi_text:
    alias: T9 — ordered Kodi text input
    mode: queued
    max: 100
    sequence:
      - action: ekf_appliances.remote_dispatch
        data:
          domain: rest_command
          service: host_kodi_text_input
          pair: projector
          return_response: true
          service_data:
            action: "{{ mode }}"
            char: "{{ char | default('') | string }}"
        response_variable: result
      - stop: Return the actual bridge response to the caller
        response_variable: result

  # Universal TV search: opens search and types the query on the active
  # source. Used from Yandex intent ("Алиса, спроси Умный дом найди в
  # телеке ..."), and callable directly for testing.
  tv_search:
    alias: TV search (chromecast / kodi)
    mode: single
    fields:
      query:
        description: Search phrase
        example: Интерстеллар
    sequence:
      - action: ekf_appliances.remote_resolve
        data: >-
          {% set request = {} %}
          {% if pair is defined %}{% set request = dict(request, pair=pair) %}{% endif %}
          {% if native is defined %}{% set request = dict(request, native=native) %}{% endif %}
          {{ request }}
        response_variable: route
      - variables:
          source: "{{ 'projector' if pair | default(route.pair) == 'projector' else 'chromecast' }}"
      - choose:
          - conditions: "{{ source == 'chromecast' }}"
            sequence:
              # Search edits the active app; it never implicitly wakes a display.
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: remote
                  service: send_command
                  pair: tv
                  service_data:
                    entity_id: remote.televizor
                    command: KEYCODE_SEARCH
                    delay_secs: 0
                response_variable: search_result
              - if: "{{ search_result.blocked | default('') != '' }}"
                then:
                  - stop: Search was rejected before opening the field
                    response_variable: search_result
              - delay: "00:00:00.8"
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: remote
                  service: send_command
                  pair: tv
                  service_data:
                    entity_id: remote.televizor
                    command: "text:{{ query }}"
                    delay_secs: 0
                response_variable: search_result
              - if: "{{ search_result.blocked | default('') != '' }}"
                then:
                  - stop: Search text was rejected
                    response_variable: search_result
              - delay: "00:00:00.3"
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: remote
                  service: send_command
                  pair: tv
                  service_data:
                    entity_id: remote.televizor
                    command: KEYCODE_ENTER
                    delay_secs: 0
          - conditions: "{{ source in ['pc', 'projector'] }}"
            sequence:
              # Kodi: open the Search window, type the query, submit.
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: kodi
                  service: call_method
                  pair: projector
                  service_data:
                    entity_id: media_player.home
                    method: GUI.ActivateWindow
                    window: search
                response_variable: search_result
              - if: "{{ search_result.blocked | default('') != '' }}"
                then:
                  - stop: Search was rejected before opening the field
                    response_variable: search_result
              - delay: "00:00:00.5"
              - action: ekf_appliances.remote_dispatch
                data:
                  domain: kodi
                  service: call_method
                  pair: projector
                  service_data:
                    entity_id: media_player.home
                    method: Input.SendText
                    text: "{{ query }}"
                    done: true

  t9_backspace:
    alias: T9 backspace
    mode: parallel
    max: 100
    sequence:
      - action: ekf_appliances.remote_resolve
        data: >-
          {% set request = {} %}
          {% if pair is defined %}{% set request = dict(request, pair=pair) %}{% endif %}
          {% if native is defined %}{% set request = dict(request, native=native) %}{% endif %}
          {{ request }}
        response_variable: route
      - action: script.t9_send_char
        data:
          mode: backspace
          pair: "{{ pair | default(route.pair) }}"
          native: "{{ native | default(route.native) }}"

  # ========== Audio mode (selected music backend) ==========
  # Explicit legacy beeps remain available to existing callers. Mode changes
  # are confirmed only by the canonical target announcement listener.
  audio_mode_beep_on:
    alias: Audio mode — activation beep
    mode: single
    sequence:
      - action: script.music_remote_command
        continue_on_error: true
        data: { command: beep_on }

  audio_mode_beep_off:
    alias: Audio mode — deactivation beep
    mode: single
    sequence:
      - action: script.music_remote_command
        continue_on_error: true
        data: { command: beep_off }

  audio_mode_activate:
    alias: Audio mode — activate
    mode: single
    sequence:
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.audio_mode }
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.audio_was_playing }

  audio_mode_deactivate:
    alias: Audio mode — deactivate
    mode: single
    sequence:
      - if: "{{ is_state('input_boolean.audio_mode', 'off') }}"
        then:
          - stop: already off
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.audio_mode
            - input_boolean.audio_was_playing
      # Never resume music here: it would undo a requested Pause or Power action.

  # Compatibility script for callers without a physical capture. Detects double-tap, toggles mode,
  # and falls back to single-press play/pause on the speaker otherwise.
  audio_mode_handle_press:
    alias: Audio button handler
    # A second press within 800ms cancels the
    # pending single-tap play/pause and activates audio mode instead.
    # So a double-tap produces a clean activation, no pause side-effect.
    mode: restart
    sequence:
      - if: "{{ is_state('input_boolean.audio_mode', 'on') }}"
        then:
          - action: script.audio_mode_deactivate
          - stop: dismissed via audio press
      - variables:
          now_ms: "{{ (now().timestamp() * 1000) | int }}"
          last_ms: "{{ states('input_text.audio_pending_tap_ms') | int(0) }}"
          dt: "{{ now_ms - last_ms }}"

      # Second tap within 800ms of a previous one → activate audio mode.
      # Wider window (500→800) because user was missing it — NEC auto-
      # repeat + human reaction put real double-taps at ~400-700ms.
      - if: "{{ 0 < dt < 800 }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.audio_pending_tap_ms }
            data: { value: "0" }
          - action: script.audio_mode_activate
          - stop: activated via double tap
      # First tap — wait for a possible second tap. If one arrives,
      # mode:restart cancels this delay. Otherwise fall through to
      # play/pause as the single-press action.
      - action: input_text.set_value
        target: { entity_id: input_text.audio_pending_tap_ms }
        data: { value: "{{ now_ms }}" }
      - delay: "00:00:00.8"
      - action: input_text.set_value
        target: { entity_id: input_text.audio_pending_tap_ms }
        data: { value: "0" }
      - action: script.music_remote_command
        data: { command: play_pause }

  # Audio-mode actions use the selected music owner. Global appliance keys
  # are handled before this script, so audio mode cannot change their meaning.
  audio_mode_dispatch:
    alias: Audio mode — dispatch action
    mode: parallel
    max: 5
    fields:
      button:
        description: Button name (e.g. 'left', 'volume_up', 'info')
      captured:
        description: The receiver has already renewed this physical press
    sequence:
      - variables:
          digit_num: "{{ button | int(-1) }}"
          music_commands:
            left: previous
            prev: previous
            right: next
            next: next
            play: play_pause
            mute: play_pause
            ok: play_pause
            volume_up: volume_up
            up: volume_up
            volume_down: volume_down
            down: volume_down
            info: info
            apple_tv: bluetooth_enable
      - if: "{{ button == 'ok_hold' }}"
        then:
          - stop: The initial OK already handled this speaker gesture
      - if: >-
          {{ button not in music_commands and button not in ['back', 'exit']
             and not 0 <= digit_num <= 9 }}
        then:
          - action: ekf_appliances.remote_reject
            data: { reason: unsupported_speaker_button }
          - stop: Unsupported speaker control
      - if: "{{ not captured | default(false) }}"
        then:
          - action: input_text.set_value
            target: { entity_id: input_text.audio_last_press_ms }
            data:
              value: "{{ (now().timestamp() * 1000) | int }}"
      - choose:
          - conditions: "{{ button in music_commands }}"
            sequence:
              - action: script.music_remote_command
                data: { command: "{{ music_commands[button] }}" }
          - conditions: "{{ digit_num == 0 }}"
            sequence:
              - action: script.music_remote_command
                data: { command: play_pause }
          - conditions: "{{ 1 <= digit_num <= 9 }}"
            sequence:
              - action: script.music_remote_command
                data:
                  command: volume_set
                  volume_level: "{{ digit_num / 10 }}"
          - conditions: "{{ button in ['back', 'exit'] }}"
            sequence:
              - action: script.audio_mode_deactivate

automation:
  - alias: Universal Remote Dispatcher
    id: universal_remote_dispatcher
    mode: parallel
    max: 100
    trigger:
      - platform: state
        entity_id: event.ekf_universal_remote
    condition:
      - condition: template
        value_template: >-
          {% set current = trigger.to_state %} {% set previous = trigger.from_state %} {% set received = current.attributes.last_received | default(0) | float(0) if current is not none else 0 %} {% set age = as_timestamp(now()) - received %} {{ current is not none and previous is not none
             and current.attributes.event_type is defined
             and current.attributes.event_type not in ['', none, 'unknown', 'unavailable', 'undefined']
             and current.state not in ['unknown', 'unavailable']
             and current.attributes.receiver_enabled | default(false)
             and 0 <= age < 5
             and (current.state != previous.state or
                  current.attributes.event_type !=
                    (previous.attributes.event_type | default('', true)))
             and (previous.state not in ['unknown', 'unavailable']
                  or received > as_timestamp(previous.last_updated, 0))
              }}
    variables:
      raw_button: "{{ trigger.to_state.attributes.event_type }}"
      t9_mode: >-
        {{ (raw_button | string).split('_')[1]
           if (raw_button | string).startswith('t9_add_') or
              (raw_button | string).startswith('t9_cycle_')
           else '' }}
      t9_digit: >-
        {{ (raw_button | string).split('_')[2]
           if (raw_button | string).startswith('t9_add_') or
              (raw_button | string).startswith('t9_cycle_')
           else '' }}
      t9_char: >-
        {{ (raw_button | string).split('_')[3]
           if (raw_button | string).startswith('t9_add_') or
              (raw_button | string).startswith('t9_cycle_')
           else '' }}
      button: >-
        {%- if (raw_button | string).startswith('t9_add_') or
              (raw_button | string).startswith('t9_cycle_') -%}
          {{ t9_digit }}
        {%- else -%}
          {{ raw_button }}
        {%- endif -%}
    action:
      - action: script.remote_modes_prepare
        data:
          button: "{{ button }}"
          received_ms: >-
            {{ trigger.to_state.attributes.last_received | float * 1000 }}
        response_variable: route
      - if: "{{ route.blocked | default('') != '' }}"
        then:
          - stop: Remote command was rejected when received
      - choose:
          - conditions: "{{ button == 'input' }}"
            sequence:
              - stop: INPUT handled by mode selector
          - conditions: "{{ button in ['channel_up', 'channel_down'] }}"
            sequence:
              - action: script.remote_ac_temperature
                data:
                  delta: "{{ 1 if button == 'channel_up' else -1 }}"
          - conditions: "{{ button == 'smart' }}"
            sequence:
              - action: light.toggle
                target:
                  entity_id: light.gostinaia_globus_socket_1
          - conditions: "{{ button == 'power' }}"
            sequence:
              - action: ekf_appliances.remote_power
                data:
                  pair: "{{ route.pair }}"
                  native: "{{ route.native }}"
                  power_request_id: "{{ route.power_request_id }}"
          - conditions: >-
              {{ button in ['prime','prime_hold','disney','disney_hold'] or (button | string).startswith('samsung_ir_') }}
            sequence:
              - stop: Handled by a dedicated appliance automation or direct physical remote
          - conditions: "{{ button in ['red','green','yellow'] }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.rgbw_lamp_rgbw
                data:
                  rgbw_color: >-
                    {{ {'red':[255,0,0,0],'green':[0,255,0,0],'yellow':[255,255,0,0]}[button] }}
                  brightness: 255
          - conditions: "{{ button == 'audio' or route.audio_action | default('') == 'handled' }}"
            sequence:
              - if: "{{ route.audio_action | default('') == 'pending' }}"
                then:
                  # Wait in this event's parallel automation, outside the shared
                  # prepare queue. Re-read the same capture after the double window.
                  - delay:
                      milliseconds: >-
                        {{ [0, (trigger.to_state.attributes.last_received | float * 1000
                              + 801 - as_timestamp(now()) * 1000) | round(0, 'ceil') | int] | max }}
                  - action: script.remote_modes_prepare
                    data:
                      button: audio
                      received_ms: "{{ trigger.to_state.attributes.last_received | float * 1000 }}"
                    response_variable: route
              - if: "{{ route.audio_action | default('') == 'play_pause' }}"
                then:
                  - action: script.music_remote_command
                    data: { command: play_pause }
              - stop: Physical Audio gesture or speaker dismissal handled
          - conditions: >-
              {{ button != 'audio' and
                 route.speaker | default(is_state('input_boolean.audio_mode', 'on')) }}
            sequence:
              - action: script.audio_mode_dispatch
                data:
                  button: "{{ button }}"
                  captured: "{{ route.speaker is defined }}"
          - conditions: "{{ button in ['volume_up','volume_down','mute'] }}"
            sequence:
              - action: script.remote_volume
                data:
                  command: "{{ button }}"
                  pair: "{{ route.pair }}"
                  native: "{{ route.native }}"
          - conditions: "{{ button == 'ok' }}"
            sequence:
              - if: "{{ route.pair == 'tv' and not route.native }}"
                then:
                  - wait_for_trigger:
                      - platform: state
                        entity_id: event.ekf_universal_remote
                        attribute: event_type
                        to: ok_hold
                    timeout: '00:00:00.300'
                    continue_on_timeout: true
                  - if: "{{ wait.trigger is not none }}"
                    then:
                      - stop: Long OK owns this keypress
              - action: script.remote_nav
                data:
                  direction: ok
                  pair: "{{ route.pair }}"
                  native: "{{ route.native }}"
          - conditions: >-
              {{ button in ['up','down','left','right','back','menu','exit','home','info','guide'] }}
            sequence:
              - action: script.remote_nav
                data:
                  direction: "{{ button }}"
                  pair: "{{ route.pair }}"
                  native: "{{ route.native }}"
          - conditions: "{{ button == 'ok_hold' }}"
            sequence:
              - choose:
                  - conditions: "{{ route.pair == 'projector' and not route.native }}"
                    sequence:
                      - action: script.remote_nav
                        data:
                          direction: menu
                          pair: "{{ route.pair }}"
                          native: false
                  - conditions: "{{ route.pair == 'tv' and not route.native }}"
                    sequence:
                      - action: ekf_appliances.remote_dispatch
                        data:
                          domain: remote
                          service: send_command
                          pair: tv
                          service_data:
                            entity_id: [remote.televizor]
                            command: DPAD_CENTER
                            delay_secs: 0
                            hold_secs: 2
          - conditions: "{{ button in ['play','prev','next'] }}"
            sequence:
              - action: script.remote_media
                data:
                  action: >-
                    {{ {'play':'play_pause','prev':'previous','next':'next'}[button] }}
                  pair: "{{ route.pair }}"
          - conditions: "{{ button in ['netflix','youtube','apple_tv'] }}"
            sequence:
              - action: script.app_launch_on_chromecast
                data:
                  activity: >-
                    {{ {'netflix':'com.netflix.ninja','youtube':'com.google.android.youtube.tv','apple_tv':'com.ionitech.airscreen'}[button] }}
          - conditions: "{{ t9_mode in ['add','cycle'] }}"
            sequence:
              - action: script.t9_send_char
                data:
                  char: "{{ t9_char }}"
                  digit: "{{ t9_digit }}"
                  mode: "{{ t9_mode }}"
                  pair: "{{ route.pair }}"
                  native: "{{ route.native }}"
          - conditions: "{{ button == 'dash' }}"
            sequence:
              - action: script.t9_backspace
                data:
                  pair: "{{ route.pair }}"
                  native: "{{ route.native }}"
        default:
          - action: system_log.write
            data:
              message: "Universal Remote: unhandled '{{ button }}'"
              level: warning

  # ===== Amazon / Prime: one power toggle per initial press =====
  - alias: Universal Remote Prime AC
    id: universal_remote_prime
    mode: single
    trigger:
      - platform: state
        entity_id: event.ekf_universal_remote
    condition:
      # A fresh EKF reception may follow unknown; restored or availability-only states are rejected.
      - condition: template
        value_template: >-
          {% set current = trigger.to_state %}
          {% set previous = trigger.from_state %}
          {% set received = current.attributes.last_received | default(0) | float(0) if current is not none else 0 %}
          {% set age = as_timestamp(now()) - received %}
          {{ current is not none and previous is not none
             and current.attributes.event_type is defined
             and current.attributes.event_type not in ['', none, 'unknown', 'unavailable', 'undefined']
             and current.state not in ['unknown', 'unavailable']
             and current.attributes.receiver_enabled | default(false)
             and 0 <= age < 5
             and (current.state != previous.state or
                  current.attributes.event_type !=
                    (previous.attributes.event_type | default('', true)))
             and (previous.state not in ['unknown', 'unavailable']
                  or received > as_timestamp(previous.last_updated, 0))
             and current.attributes.event_type == 'prime' }}
    action:
      # A held key also emits prime_hold; it must not send a second command.
      - action: script.remote_ac_toggle

  # ===== Remember the AC's last non-off mode =====
  # Retain the legacy helper for external callers; it does not select the
  # mode of the Amazon power-on action.
  - alias: Remember AC last mode
    id: ac_remember_last_mode
    mode: single
    trigger:
      - platform: state
        entity_id: climate.kondei_1
    condition:
      - condition: template
        value_template: >-
          {% set mode = trigger.to_state.state if trigger.to_state is not none else none %}
          {{ mode not in ['off', 'unknown', 'unavailable', none] and
             not (now().month in [5, 6, 7, 8, 9] and mode == 'heat') and
             mode != states('input_text.ac_last_mode') }}
    action:
      - action: input_text.set_value
        target: { entity_id: input_text.ac_last_mode }
        data: { value: "{{ trigger.to_state.state }}" }

  # ===== Disney: open Kodi (short) / play next episode (hold) =====
  - alias: Universal Remote Disney
    id: universal_remote_disney
    mode: parallel
    max: 5
    trigger:
      - platform: state
        entity_id: event.ekf_universal_remote
    condition:
      # A fresh EKF reception may follow unknown; restored or availability-only states are rejected.
      - condition: template
        value_template: >-
          {% set current = trigger.to_state %}
          {% set previous = trigger.from_state %}
          {% set received = current.attributes.last_received | default(0) | float(0) if current is not none else 0 %}
          {% set age = as_timestamp(now()) - received %}
          {{ current is not none and previous is not none
             and current.attributes.event_type is defined
             and current.attributes.event_type not in ['', none, 'unknown', 'unavailable', 'undefined']
             and current.state not in ['unknown', 'unavailable']
             and current.attributes.receiver_enabled | default(false)
             and 0 <= age < 5
             and (current.state != previous.state or
                  current.attributes.event_type !=
                    (previous.attributes.event_type | default('', true)))
             and (previous.state not in ['unknown', 'unavailable']
                  or received > as_timestamp(previous.last_updated, 0))
             and current.attributes.event_type in ['disney', 'disney_hold'] }}
    action:
      - variables:
          ev: "{{ trigger.to_state.attributes.event_type }}"
      - action: script.remote_modes_prepare
        data:
          button: "{{ ev }}"
          received_ms: >-
            {{ trigger.to_state.attributes.last_received | float * 1000 }}
        response_variable: route
      - if: "{{ route.blocked | default('') != '' }}"
        then:
          - stop: Projector command was rejected when received
      - choose:
          - conditions: "{{ ev == 'disney_hold' }}"
            sequence:
              - action: script.source_to_pc
                response_variable: source_result
          - conditions: "{{ ev == 'disney' }}"
            sequence:
              # Wait 300ms for a possible disney_hold. If it arrives we abort.
              - wait_for_trigger:
                  - platform: state
                    entity_id: event.ekf_universal_remote
                timeout: "00:00:00.300"
                continue_on_timeout: true
              - if: >-
                  {{ wait.trigger is not none and
                     (wait.trigger.to_state.attributes.event_type | default('', true)) == 'disney_hold' }}
                then:
                  - stop: "hold detected, disney short suppressed"
              - action: script.source_to_pc
                response_variable: source_result
      - if: "{{ source_result.sent | default(false) is not sameas true }}"
        then:
          - if: "{{ source_result.blocked | default('') == '' }}"
            then:
              - action: ekf_appliances.remote_reject
                data:
                  reason: projector_source_rejected
          - stop: Projector source request was rejected
      - if: "{{ ev == 'disney_hold' }}"
        then:
          - delay: "00:00:02"
          - action: script.kodi_play_next_episode

  # ===== Yandex voice search → TV =====
  # Triggered by "Алиса, спроси Умный дом найди в телеке <фраза>".
  # Requires AlexxIT/YandexDialogs set up with an intent "search_tv"
  # that has grammar "найди в телеке $query" (YANDEX.STRING entity).
  - alias: TV search via Yandex intent
    id: tv_search_via_yandex
    mode: parallel
    max: 3
    trigger:
      - platform: event
        event_type: yandex_intent
        event_data:
          intent: search_tv
    action:
      - action: script.tv_search
        data:
          query: "{{ trigger.event.data.query }}"
      - event: yandex_intent_response
        event_data:
          text: "Ищу {{ trigger.event.data.query }}"
          end_session: true

  # The controller expires speaker focus from the physical capture timestamp.

  # Compatibility automations only refresh the canonical owner. They do not
  # own focus deadlines, wake tasks or helper-based selection anymore.
  - alias: Пульт — истечение фокуса
    id: universal_remote_projector_timeout
    mode: single
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.universal_remote_projector
    action:
      - action: ekf_appliances.remote_resolve
  - alias: Пульт — выбор по состоянию экранов
    id: universal_remote_power_focus
    mode: queued
    max: 20
    trigger:
      - platform: state
        entity_id:
          - media_player.ue48j5500_ue48j5500
          - media_player.projector
    action:
      - action: ekf_appliances.remote_resolve
  - alias: Пульт — начальный режим
    id: universal_remote_startup
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.audio_mode
      - action: ekf_appliances.remote_resolve

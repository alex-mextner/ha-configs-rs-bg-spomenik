# Install only for the measured ODROID-N2 Kodi startup failure.
# The helper is root-owned; isolated Python ignores user paths and environment.
# The existing main command, service user, and restart policy remain in force.
[Service]
ExecStartPre=-+/usr/bin/timeout --kill-after=2s 55s /usr/bin/python3 -I /usr/local/libexec/ha_kodi_prestart.py

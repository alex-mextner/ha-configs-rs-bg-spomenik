# Installed as /etc/systemd/system/kodi.service.d/60-clean-stop.conf.
# kodi-session execs kodi.bin, so the main process is Kodi itself and SIGTERM makes it quit with exit 0.
# Its shutdown (player stop, add-on services, skin unload) took 18-30 s on this board in the 2026-11-15/16
# stops, longer than the unit's 20 s: allow 60 s before SIGKILL.
# mixed: SIGTERM reaches only Kodi; the headless Xvfb is killed after Kodi has exited, so Kodi never loses
# its X server mid-shutdown (that ended in an X IO error and a failed unit).
# 65 is Kodi's "restart application" exit code; the Debian wrapper looped on it, systemd restarts it now.
[Service]
TimeoutStopSec=60
KillMode=mixed
RestartForceExitStatus=65
